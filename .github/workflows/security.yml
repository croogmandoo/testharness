name: Security

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # Run every Monday at 06:00 UTC to catch newly-disclosed CVEs
    - cron: "0 6 * * 1"

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan all commits, not just HEAD
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit requirements.txt
        run: |
          # CVE-2025-71176 (pytest) ignored: fix requires pytest>=9 which is
          # blocked by pytest-asyncio requiring pytest<9. Re-evaluate when
          # pytest-asyncio drops that constraint.
          pip-audit -r requirements.txt --ignore-vuln CVE-2025-71176

      - name: Audit requirements.lock
        run: |
          # The lock is what CI and the Docker images actually install, so it
          # must be audited too — requirements.txt alone resolves to the
          # latest releases and misses stale pins in the lock.
          # CVE-2025-71176 ignored for the same reason as above.
          pip-audit -r requirements.lock --ignore-vuln CVE-2025-71176
