browser:
  headless: true
  timeout_ms: 30000

# Process environment variables that app YAML ($VAR references) may read.
# Default (absent/empty): none — app YAML resolves from the secrets store only.
# Entries are exact names or fnmatch globs. ["*"] restores the legacy
# "any env var" behaviour and logs a warning (exposes server secrets to anyone
# who can edit apps). config.yaml itself always resolves from the full env.
# Keep entries narrow: a broad prefix such as HARNESS_* also matches
# HARNESS_API_KEY and other server credentials. Allowlisted names that look
# like credentials (*KEY*, *SECRET*, *PASSWORD*, *TOKEN*) are logged as a
# warning at startup.
# apps_env_allowlist:
#   - MYAPP_BASE_URL
#   - "MYAPP_*"

# Analytics export — daily Parquet snapshot to local FS or Azure Blob/ADLS Gen2.
# See docs/guides/analytics.md for the full BI/DIO team integration guide.
# analytics:
#   enabled: true
#   export_cron: "0 1 * * *"             # daily 01:00 UTC (standard cron, 0=Sun)
#   tables: [runs, test_results, app_state, audit_log]   # default = all
#   target:
#     type: azure_blob                    # "azure_blob" | "local"
#     container: synthetics               # blob container name (must exist)
#     prefix: harness/                    # path prefix inside container
#     connection_string: "$AZURE_STORAGE_CONNECTION_STRING"
