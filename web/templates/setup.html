<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup — Harness</title>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
  <script>
    (function(){
      var t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <span class="auth-wordmark">Harness</span>
    <div class="auth-heading">Create admin account</div>
    {% if error %}
    <div class="form-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/setup">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field">
        <label class="label">Username</label>
        <input class="input" name="username" required autofocus autocomplete="username">
      </div>
      <div class="field">
        <label class="label">Display name <span class="text-muted font-normal">(optional)</span></label>
        <input class="input" name="display_name" autocomplete="name">
      </div>
      <div class="field">
        <label class="label">Password</label>
        <input class="input" name="password" type="password" required autocomplete="new-password">
      </div>
      <div class="field mb-6">
        <label class="label">Confirm password</label>
        <input class="input" name="confirm" type="password" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary w-full">
        Create admin &amp; sign in
      </button>
    </form>
  </div>
</div>
</body>
</html>
