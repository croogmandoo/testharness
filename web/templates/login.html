<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Harness</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>
    (function(){
      var t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <span class="auth-wordmark">Harness</span>
    <div class="auth-heading">Sign in</div>
    {% if error %}
    <div class="form-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/auth/login">
      <div class="field">
        <label class="label">Username</label>
        <input class="input" name="username" required autofocus autocomplete="username">
      </div>
      <div class="field mb-6">
        <label class="label">Password</label>
        <input class="input" name="password" type="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary w-full">
        Sign in
      </button>
    </form>
    {% if github_oauth_enabled %}
    <div class="oauth-divider"><span>or</span></div>
    <a href="/auth/oauth/github/login" class="btn-oauth btn-oauth--github">
      Login with GitHub
    </a>
    {% endif %}
  </div>
</div>
</body>
</html>
